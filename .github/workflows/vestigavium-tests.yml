name: Vestigavium research tests
on:
  push:
    paths:
      - 'research/Vestigavium.sol'
      - 'research/test/Vestigavium.t.sol'
      - '.github/workflows/vestigavium-tests.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - name: Compile and test isolated research candidate
        run: |
          mkdir -p /tmp/vestigavium-test/src /tmp/vestigavium-test/test
          cp research/Vestigavium.sol /tmp/vestigavium-test/src/
          sed 's|../Vestigavium.sol|../src/Vestigavium.sol|' research/test/Vestigavium.t.sol > /tmp/vestigavium-test/test/Vestigavium.t.sol
          cd /tmp/vestigavium-test
          forge test --use 0.8.24 -vvv
